services:
  redis:
    image: redis:7-alpine
    container_name: omniroute-redis
    restart: unless-stopped
    command: redis-server --save 60 1 --loglevel warning
    volumes:
      - omniroute-redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - default

  omniroute:
    image: diegosouzapw/omniroute:3.8.49
    container_name: omniroute-oc
    restart: unless-stopped
    stop_grace_period: 40s
    env_file: .env
    environment:
      DATA_DIR: /app/data
      PORT: ${PORT:-20138}
      DASHBOARD_PORT: ${PORT:-20138}
      API_PORT: ${API_PORT:-20139}
      API_HOST: 0.0.0.0
      REDIS_URL: ${REDIS_URL:-redis://redis:6379}
    ports:
      - "${PORT:-20138}:${PORT:-20138}"
      - "${API_PORT:-20139}:${API_PORT:-20139}"
    volumes:
      - omniroute-data:/app/data
    depends_on:
      redis:
        condition: service_healthy
    networks:
      - default

volumes:
  omniroute-redis-data:
    name: omniroute-redis-data
  omniroute-data:
    name: omniroute-data
